---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-demo
  namespace: radar-demo
  labels:
    app.kubernetes.io/name: radar-demo
    app.kubernetes.io/part-of: radar-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radar-demo
        app.kubernetes.io/part-of: radar-lab
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: radar-demo
      automountServiceAccountToken: false
      containers:
        - name: radar-demo
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          command: ["/usr/sbin/nginx"]
          args: ["-c", "/etc/radar/nginx.conf", "-g", "daemon off;"]
          env:
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: radar-demo-credentials-v1
                  key: demo-token
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: config
              mountPath: /etc/radar
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: scratch
          emptyDir: {}
        - name: config
          configMap:
            name: radar-demo-config
