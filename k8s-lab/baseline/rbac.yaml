---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radar-demo-reader
  namespace: radar-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radar-demo-reader
  namespace: radar-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radar-demo-reader
subjects:
  - kind: ServiceAccount
    name: radar-demo
    namespace: radar-demo
