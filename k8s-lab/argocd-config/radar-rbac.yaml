---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.default: role:radar-no-access
  policy.matchMode: glob
  policy.csv: |
    p, role:radar-readonly, applications, get, radar/radar-lab, allow
    p, role:radar-readonly, projects, get, radar, allow
    g, radar, role:radar-readonly
    g, radar-viewer, role:radar-readonly
