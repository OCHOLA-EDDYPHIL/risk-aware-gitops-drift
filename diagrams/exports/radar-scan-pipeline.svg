<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" aria-labelledby="title desc" role="img" viewBox="0 0 1200 650"><title id="title">RADAR scan and classification pipeline</title><desc id="desc">RADAR collects Application and managed-resource evidence from Argo CD, selects and normalizes desired and live states, derives ordered atomic changes, evaluates each finding with OPA and Rego, and reports the selected decision. Missing field-level state follows a conservative INFO path.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#24251f" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.eyebrow{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#5f6257}.heading,.step{font:700 34px Georgia,serif;fill:#24251f}.step{font:700 18px Arial,sans-serif}.copy{font:15px Arial,sans-serif;fill:#5f6257}.number{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24251f}.line{fill:none;stroke:#24251f;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style></defs><rect width="1200" height="650" fill="#f5f2ea"/><text x="40" y="48" class="eyebrow">DETERMINISTIC SCAN PATH</text><text x="40" y="88" class="heading">From Argo CD evidence to an explainable decision</text><g><rect width="200" height="150" x="35" y="185" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="18"/><text x="55" y="214" class="number">01</text><text x="135" y="248" class="step" text-anchor="middle">Collect evidence</text><text x="135" y="278" class="copy" text-anchor="middle">Application status</text><text x="135" y="301" class="copy" text-anchor="middle">managed resources</text></g><g><rect width="200" height="150" x="270" y="185" fill="#e8dfd3" stroke="#24251f" stroke-width="2" rx="18"/><text x="290" y="214" class="number">02</text><text x="370" y="248" class="step" text-anchor="middle">Normalize state</text><text x="370" y="278" class="copy" text-anchor="middle">select desired and live</text><text x="370" y="301" class="copy" text-anchor="middle">remove declared noise</text></g><g><rect width="200" height="150" x="505" y="185" fill="#e8dfd3" stroke="#24251f" stroke-width="2" rx="18"/><text x="525" y="214" class="number">03</text><text x="605" y="248" class="step" text-anchor="middle">Derive changes</text><text x="605" y="278" class="copy" text-anchor="middle">add · remove · replace</text><text x="605" y="301" class="copy" text-anchor="middle">ordered JSON Pointers</text></g><g><rect width="200" height="150" x="740" y="185" fill="#ead8d4" stroke="#24251f" stroke-width="2" rx="18"/><text x="760" y="214" class="number">04</text><text x="840" y="248" class="step" text-anchor="middle">Evaluate policy</text><text x="840" y="278" class="copy" text-anchor="middle">OPA / Rego decisions</text><text x="840" y="301" class="copy" text-anchor="middle">deterministic selection</text></g><g><rect width="190" height="150" x="975" y="185" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="18"/><text x="995" y="214" class="number">05</text><text x="1070" y="248" class="step" text-anchor="middle">Report finding</text><text x="1070" y="278" class="copy" text-anchor="middle">resource · change · risk</text><text x="1070" y="301" class="copy" text-anchor="middle">reason · recommendation</text></g><path d="M235 260 H270" class="line"/><path d="M470 260 H505" class="line"/><path d="M705 260 H740" class="line"/><path d="M940 260 H975" class="line"/><path d="M370 335 V457.5 H505" class="line dash"/><rect width="330" height="105" x="505" y="405" fill="#fffdf8" stroke="#24251f" stroke-width="2" rx="18"/><text x="670" y="445" class="step" text-anchor="middle">No usable field-level state</text><text x="670" y="477" class="copy" text-anchor="middle">Return INFO; do not infer security severity.</text><text x="40" y="592" class="copy">Configuration, policy, or timeout failures stop the scan instead of producing a partial classification.</text></svg>