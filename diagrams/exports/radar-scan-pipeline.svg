<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">RADAR scan and classification pipeline</title>
  <desc id="desc">RADAR collects Application and managed-resource evidence from Argo CD, selects and normalizes desired and live states, derives ordered atomic changes, evaluates each finding with OPA and Rego, and reports the selected decision. Missing field-level state follows a conservative INFO path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24251f"/>
    </marker>
    <style>
      .eyebrow { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px; fill: #5f6257; }
      .heading { font: 700 34px Georgia, serif; fill: #24251f; }
      .step { font: 700 18px Arial, sans-serif; fill: #24251f; }
      .copy { font: 15px Arial, sans-serif; fill: #5f6257; }
      .number { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #24251f; }
      .line { fill: none; stroke: #24251f; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#f5f2ea"/>
  <text class="eyebrow" x="40" y="48">DETERMINISTIC SCAN PATH</text>
  <text class="heading" x="40" y="88">From Argo CD evidence to an explainable decision</text>

  <g>
    <rect x="35" y="185" width="200" height="150" rx="18" fill="#dfe8d8" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="55" y="214">01</text>
    <text class="step" x="135" y="248" text-anchor="middle">Collect evidence</text>
    <text class="copy" x="135" y="278" text-anchor="middle">Application status</text>
    <text class="copy" x="135" y="301" text-anchor="middle">managed resources</text>
  </g>

  <g>
    <rect x="270" y="185" width="200" height="150" rx="18" fill="#e8dfd3" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="290" y="214">02</text>
    <text class="step" x="370" y="248" text-anchor="middle">Normalize state</text>
    <text class="copy" x="370" y="278" text-anchor="middle">select desired and live</text>
    <text class="copy" x="370" y="301" text-anchor="middle">remove declared noise</text>
  </g>

  <g>
    <rect x="505" y="185" width="200" height="150" rx="18" fill="#e8dfd3" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="525" y="214">03</text>
    <text class="step" x="605" y="248" text-anchor="middle">Derive changes</text>
    <text class="copy" x="605" y="278" text-anchor="middle">add · remove · replace</text>
    <text class="copy" x="605" y="301" text-anchor="middle">ordered JSON Pointers</text>
  </g>

  <g>
    <rect x="740" y="185" width="200" height="150" rx="18" fill="#ead8d4" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="760" y="214">04</text>
    <text class="step" x="840" y="248" text-anchor="middle">Evaluate policy</text>
    <text class="copy" x="840" y="278" text-anchor="middle">OPA / Rego decisions</text>
    <text class="copy" x="840" y="301" text-anchor="middle">deterministic selection</text>
  </g>

  <g>
    <rect x="975" y="185" width="190" height="150" rx="18" fill="#dfe8d8" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="995" y="214">05</text>
    <text class="step" x="1070" y="248" text-anchor="middle">Report finding</text>
    <text class="copy" x="1070" y="278" text-anchor="middle">resource · change · risk</text>
    <text class="copy" x="1070" y="301" text-anchor="middle">reason · recommendation</text>
  </g>

  <path class="line" d="M235 260 H270"/>
  <path class="line" d="M470 260 H505"/>
  <path class="line" d="M705 260 H740"/>
  <path class="line" d="M940 260 H975"/>

  <path class="line dash" d="M370 335 V457.5 H505"/>
  <rect x="505" y="405" width="330" height="105" rx="18" fill="#fffdf8" stroke="#24251f" stroke-width="2"/>
  <text class="step" x="670" y="445" text-anchor="middle">No usable field-level state</text>
  <text class="copy" x="670" y="477" text-anchor="middle">Return INFO; do not infer security severity.</text>

  <text class="copy" x="40" y="592">Configuration, policy, or timeout failures stop the scan instead of producing a partial classification.</text>
</svg>
