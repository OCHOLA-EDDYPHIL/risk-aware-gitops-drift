<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1200 720"><title id="title">RADAR system architecture</title><desc id="desc">Git supplies desired manifests to Argo CD in an isolated Kubernetes laboratory. The RADAR CLI runs on a provider-neutral execution host, reads drift evidence from Argo CD, evaluates atomic changes with OPA and Rego, and writes a terminal or JSON report. RADAR never writes to Kubernetes.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#24251f" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.eyebrow{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#5f6257}.heading{font:700 34px Georgia,serif;fill:#24251f}.group,.label{font:700 18px Arial,sans-serif;fill:#24251f}.label{font:700 19px Arial,sans-serif}.copy,.edge-label{font:16px Arial,sans-serif;fill:#5f6257}.edge-label{font:15px Arial,sans-serif;paint-order:stroke;stroke:#f5f2ea;stroke-width:6px;stroke-linejoin:round}.line{fill:none;stroke:#24251f;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style></defs><rect width="1200" height="720" fill="#f5f2ea"/><text x="40" y="48" class="eyebrow">READ-ONLY INTERPRETATION</text><text x="40" y="88" class="heading">RADAR system architecture</text><rect width="215" height="105" x="35" y="220" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="16"/><text x="142.5" y="258" class="label" text-anchor="middle">Git repository</text><text x="142.5" y="284" class="copy" text-anchor="middle">source, policy</text><text x="142.5" y="306" class="copy" text-anchor="middle">and desired manifests</text><rect width="400" height="450" x="295" y="115" fill="#fffdf8" stroke="#24251f" stroke-width="2" rx="22"/><text x="320" y="151" class="group">Isolated Kubernetes laboratory</text><rect width="310" height="90" x="340" y="205" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="14"/><text x="495" y="243" class="label" text-anchor="middle">Argo CD</text><text x="495" y="269" class="copy" text-anchor="middle">comparison and read-only API</text><rect width="310" height="90" x="340" y="405" fill="#e8dfd3" stroke="#24251f" stroke-width="2" rx="14"/><text x="495" y="443" class="label" text-anchor="middle">Synthetic workload</text><text x="495" y="469" class="copy" text-anchor="middle">desired and live resource state</text><rect width="420" height="450" x="745" y="115" fill="#fffdf8" stroke="#24251f" stroke-width="2" rx="22"/><text x="770" y="151" class="group">Provider-neutral execution host</text><rect width="170" height="100" x="790" y="190" fill="#e8dfd3" stroke="#24251f" stroke-width="2" rx="14"/><text x="875" y="232" class="label" text-anchor="middle">RADAR CLI</text><text x="875" y="258" class="copy" text-anchor="middle">collect · diff</text><text x="875" y="279" class="copy" text-anchor="middle">coordinate</text><rect width="120" height="100" x="1000" y="190" fill="#ead8d4" stroke="#24251f" stroke-width="2" rx="14"/><text x="1060" y="232" class="label" text-anchor="middle">OPA</text><text x="1060" y="258" class="copy" text-anchor="middle">Rego policy</text><rect width="240" height="90" x="835" y="405" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="14"/><text x="955" y="443" class="label" text-anchor="middle">Explainable report</text><text x="955" y="469" class="copy" text-anchor="middle">terminal or JSON</text><path d="M250 272.5 H340" class="line"/><text x="295" y="253" class="edge-label" text-anchor="middle">desired manifests</text><path d="M590 295 V405" class="line"/><text x="605" y="355" class="edge-label">reconciles</text><path d="M385 405 V295" class="line dash"/><text x="368" y="355" class="edge-label" text-anchor="end">live state</text><path d="M650 240 H790" class="line"/><text x="720" y="219" class="edge-label" text-anchor="middle">read-only evidence</text><path d="M960 220 H1000" class="line"/><text x="980" y="202" class="edge-label" text-anchor="middle">query</text><path d="M1000 270 H960" class="line dash"/><text x="980" y="313" class="edge-label" text-anchor="middle">decision</text><path d="M875 290 V405" class="line"/><text x="891" y="353" class="edge-label">finding</text><rect width="570" height="54" x="295" y="615" fill="#fffdf8" stroke="#24251f" stroke-width="1.5" rx="27"/><text x="580" y="648" class="copy" text-anchor="middle">Argo CD reconciles. RADAR reads evidence and never writes to Kubernetes.</text></svg>