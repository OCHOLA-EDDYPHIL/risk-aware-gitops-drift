<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RADAR system architecture</title>
  <desc id="desc">Git supplies desired manifests to Argo CD in an isolated Kubernetes laboratory. The RADAR CLI runs on a provider-neutral execution host, reads drift evidence from Argo CD, evaluates atomic changes with OPA and Rego, and writes a terminal or JSON report. RADAR never writes to Kubernetes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24251f"/>
    </marker>
    <style>
      .eyebrow { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px; fill: #5f6257; }
      .heading { font: 700 34px Georgia, serif; fill: #24251f; }
      .group { font: 700 18px Arial, sans-serif; fill: #24251f; }
      .label { font: 700 19px Arial, sans-serif; fill: #24251f; }
      .copy { font: 16px Arial, sans-serif; fill: #5f6257; }
      .edge-label { font: 15px Arial, sans-serif; fill: #5f6257; paint-order: stroke; stroke: #f5f2ea; stroke-width: 6px; stroke-linejoin: round; }
      .line { fill: none; stroke: #24251f; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f5f2ea"/>
  <text class="eyebrow" x="40" y="48">READ-ONLY INTERPRETATION</text>
  <text class="heading" x="40" y="88">RADAR system architecture</text>

  <rect x="35" y="220" width="215" height="105" rx="16" fill="#dfe8d8" stroke="#24251f" stroke-width="2"/>
  <text class="label" x="142.5" y="258" text-anchor="middle">Git repository</text>
  <text class="copy" x="142.5" y="284" text-anchor="middle">source, policy</text>
  <text class="copy" x="142.5" y="306" text-anchor="middle">and desired manifests</text>

  <rect x="295" y="115" width="400" height="450" rx="22" fill="#fffdf8" stroke="#24251f" stroke-width="2"/>
  <text class="group" x="320" y="151">Isolated Kubernetes laboratory</text>

  <rect x="340" y="205" width="310" height="90" rx="14" fill="#dfe8d8" stroke="#24251f" stroke-width="2"/>
  <text class="label" x="495" y="243" text-anchor="middle">Argo CD</text>
  <text class="copy" x="495" y="269" text-anchor="middle">comparison and read-only API</text>

  <rect x="340" y="405" width="310" height="90" rx="14" fill="#e8dfd3" stroke="#24251f" stroke-width="2"/>
  <text class="label" x="495" y="443" text-anchor="middle">Synthetic workload</text>
  <text class="copy" x="495" y="469" text-anchor="middle">desired and live resource state</text>

  <rect x="745" y="115" width="420" height="450" rx="22" fill="#fffdf8" stroke="#24251f" stroke-width="2"/>
  <text class="group" x="770" y="151">Provider-neutral execution host</text>

  <rect x="790" y="190" width="170" height="100" rx="14" fill="#e8dfd3" stroke="#24251f" stroke-width="2"/>
  <text class="label" x="875" y="232" text-anchor="middle">RADAR CLI</text>
  <text class="copy" x="875" y="258" text-anchor="middle">collect · diff</text>
  <text class="copy" x="875" y="279" text-anchor="middle">coordinate</text>

  <rect x="1000" y="190" width="120" height="100" rx="14" fill="#ead8d4" stroke="#24251f" stroke-width="2"/>
  <text class="label" x="1060" y="232" text-anchor="middle">OPA</text>
  <text class="copy" x="1060" y="258" text-anchor="middle">Rego policy</text>

  <rect x="835" y="405" width="240" height="90" rx="14" fill="#dfe8d8" stroke="#24251f" stroke-width="2"/>
  <text class="label" x="955" y="443" text-anchor="middle">Explainable report</text>
  <text class="copy" x="955" y="469" text-anchor="middle">terminal or JSON</text>

  <path class="line" d="M250 272.5 H340"/>
  <text class="edge-label" x="295" y="253" text-anchor="middle">desired manifests</text>

  <path class="line" d="M590 295 V405"/>
  <text class="edge-label" x="605" y="355">reconciles</text>

  <path class="line dash" d="M385 405 V295"/>
  <text class="edge-label" x="368" y="355" text-anchor="end">live state</text>

  <path class="line" d="M650 240 H790"/>
  <text class="edge-label" x="720" y="219" text-anchor="middle">read-only evidence</text>

  <path class="line" d="M960 220 H1000"/>
  <text class="edge-label" x="980" y="202" text-anchor="middle">query</text>

  <path class="line dash" d="M1000 270 H960"/>
  <text class="edge-label" x="980" y="313" text-anchor="middle">decision</text>

  <path class="line" d="M875 290 V405"/>
  <text class="edge-label" x="891" y="353">finding</text>

  <rect x="295" y="615" width="570" height="54" rx="27" fill="#fffdf8" stroke="#24251f" stroke-width="1.5"/>
  <text class="copy" x="580" y="648" text-anchor="middle">Argo CD reconciles. RADAR reads evidence and never writes to Kubernetes.</text>
</svg>
