<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1200 680"><title id="title">RADAR logical drift-record model</title><desc id="desc">One drift report contains application status and zero or more findings. Each finding retains trace fields and contains one resource identity, one atomic change, and one selected risk decision.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#24251f" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.eyebrow{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#5f6257}.heading,.label{font:700 34px Georgia,serif;fill:#24251f}.label{font:700 20px Arial,sans-serif}.copy{font:16px Arial,sans-serif;fill:#5f6257}.line{fill:none;stroke:#24251f;stroke-width:2.5;marker-end:url(#arrow)}</style></defs><rect width="1200" height="680" fill="#f5f2ea"/><text x="40" y="48" class="eyebrow">JSON OUTPUT MODEL</text><text x="40" y="88" class="heading">One finding, one atomic change, one selected decision</text><rect width="440" height="105" x="380" y="130" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="18"/><text x="600" y="170" class="label" text-anchor="middle">Drift report [1]</text><text x="600" y="201" class="copy" text-anchor="middle">application · project · syncStatus · healthStatus</text><rect width="440" height="105" x="380" y="295" fill="#e8dfd3" stroke="#24251f" stroke-width="2" rx="18"/><text x="600" y="335" class="label" text-anchor="middle">Finding [0..*]</text><text x="600" y="366" class="copy" text-anchor="middle">id · observedAt · evidenceSource · matchedRuleIds</text><rect width="330" height="125" x="40" y="485" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="18"/><text x="205" y="525" class="label" text-anchor="middle">Resource [1]</text><text x="205" y="556" class="copy" text-anchor="middle">group · version · kind</text><text x="205" y="580" class="copy" text-anchor="middle">namespace · name</text><rect width="330" height="125" x="435" y="485" fill="#e8dfd3" stroke="#24251f" stroke-width="2" rx="18"/><text x="600" y="525" class="label" text-anchor="middle">Atomic change [1]</text><text x="600" y="556" class="copy" text-anchor="middle">operation · path · before · after</text><text x="600" y="580" class="copy" text-anchor="middle">confidence</text><rect width="330" height="125" x="830" y="485" fill="#ead8d4" stroke="#24251f" stroke-width="2" rx="18"/><text x="995" y="525" class="label" text-anchor="middle">Risk decision [1]</text><text x="995" y="556" class="copy" text-anchor="middle">ruleId · impact · likelihood</text><text x="995" y="580" class="copy" text-anchor="middle">score · severity · reason / recommendation</text><path d="M600 235 V295" class="line"/><path d="M600 400 V442 H205 V485" class="line"/><path d="M600 400 V485" class="line"/><path d="M600 400 V442 H995 V485" class="line"/></svg>