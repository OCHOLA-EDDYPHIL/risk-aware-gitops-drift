<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1200 720"><title id="title">RADAR controlled evaluation workflow</title><desc id="desc">Each declared run verifies a clean baseline, applies one change, waits for stable drift, captures Argo CD evidence, evaluates and records the finding, then resets and verifies the baseline. A failed reset stops collection.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#24251f" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.eyebrow{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#5f6257}.heading,.step{font:700 34px Georgia,serif;fill:#24251f}.step{font:700 18px Arial,sans-serif}.copy{font:15px Arial,sans-serif;fill:#5f6257}.number{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24251f}.line{fill:none;stroke:#24251f;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style></defs><rect width="1200" height="720" fill="#f5f2ea"/><text x="40" y="48" class="eyebrow">FAIL-CLOSED COLLECTION</text><text x="40" y="88" class="heading">Controlled evaluation workflow</text><g><rect width="300" height="120" x="45" y="165" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="18"/><text x="65" y="195" class="number">01</text><text x="195" y="225" class="step" text-anchor="middle">Verify clean baseline</text><text x="195" y="254" class="copy" text-anchor="middle">Synced · Healthy · declared fields</text></g><g><rect width="300" height="120" x="450" y="165" fill="#e8dfd3" stroke="#24251f" stroke-width="2" rx="18"/><text x="470" y="195" class="number">02</text><text x="600" y="225" class="step" text-anchor="middle">Apply one declared change</text><text x="600" y="254" class="copy" text-anchor="middle">synthetic workload only</text></g><g><rect width="300" height="120" x="855" y="165" fill="#e8dfd3" stroke="#24251f" stroke-width="2" rx="18"/><text x="875" y="195" class="number">03</text><text x="1005" y="225" class="step" text-anchor="middle">Wait for stable drift</text><text x="1005" y="254" class="copy" text-anchor="middle">bounded observation window</text></g><g><rect width="300" height="120" x="855" y="390" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="18"/><text x="875" y="420" class="number">04</text><text x="1005" y="450" class="step" text-anchor="middle">Capture stable evidence</text><text x="1005" y="479" class="copy" text-anchor="middle">bracketed Argo CD observations</text></g><g><rect width="300" height="120" x="450" y="390" fill="#ead8d4" stroke="#24251f" stroke-width="2" rx="18"/><text x="470" y="420" class="number">05</text><text x="600" y="450" class="step" text-anchor="middle">Evaluate and record</text><text x="600" y="479" class="copy" text-anchor="middle">finding · decision · checksums</text></g><g><rect width="300" height="120" x="45" y="390" fill="#dfe8d8" stroke="#24251f" stroke-width="2" rx="18"/><text x="65" y="420" class="number">06</text><text x="195" y="450" class="step" text-anchor="middle">Reset and verify baseline</text><text x="195" y="479" class="copy" text-anchor="middle">continue only after verification</text></g><path d="M345 225 H450" class="line"/><path d="M750 225 H855" class="line"/><path d="M1005 285 V390" class="line"/><path d="M855 450 H750" class="line"/><path d="M450 450 H345" class="line"/><path d="M195 390 V330 H120 V285" class="line dash"/><text x="212" y="350" class="copy">next declared run</text><path d="M195 510 V575" class="line"/><rect width="300" height="86" x="45" y="575" fill="#ead8d4" stroke="#5b2b24" stroke-width="2" rx="18"/><text x="195" y="609" fill="#5b2b24" class="step" text-anchor="middle">Stop collection</text><text x="195" y="638" fill="#5b2b24" class="copy" text-anchor="middle">if reset verification fails</text><text x="450" y="620" class="copy">One declared mutation per run. Formal records remain bound to the frozen protocol and source revision.</text></svg>