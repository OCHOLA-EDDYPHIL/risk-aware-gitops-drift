<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RADAR controlled evaluation workflow</title>
  <desc id="desc">Each declared run verifies a clean baseline, applies one change, waits for stable drift, captures Argo CD evidence, evaluates and records the finding, then resets and verifies the baseline. A failed reset stops collection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24251f"/>
    </marker>
    <style>
      .eyebrow { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px; fill: #5f6257; }
      .heading { font: 700 34px Georgia, serif; fill: #24251f; }
      .step { font: 700 18px Arial, sans-serif; fill: #24251f; }
      .copy { font: 15px Arial, sans-serif; fill: #5f6257; }
      .number { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #24251f; }
      .line { fill: none; stroke: #24251f; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f5f2ea"/>
  <text class="eyebrow" x="40" y="48">FAIL-CLOSED COLLECTION</text>
  <text class="heading" x="40" y="88">Controlled evaluation workflow</text>

  <g>
    <rect x="45" y="165" width="300" height="120" rx="18" fill="#dfe8d8" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="65" y="195">01</text>
    <text class="step" x="195" y="225" text-anchor="middle">Verify clean baseline</text>
    <text class="copy" x="195" y="254" text-anchor="middle">Synced · Healthy · declared fields</text>
  </g>

  <g>
    <rect x="450" y="165" width="300" height="120" rx="18" fill="#e8dfd3" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="470" y="195">02</text>
    <text class="step" x="600" y="225" text-anchor="middle">Apply one declared change</text>
    <text class="copy" x="600" y="254" text-anchor="middle">synthetic workload only</text>
  </g>

  <g>
    <rect x="855" y="165" width="300" height="120" rx="18" fill="#e8dfd3" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="875" y="195">03</text>
    <text class="step" x="1005" y="225" text-anchor="middle">Wait for stable drift</text>
    <text class="copy" x="1005" y="254" text-anchor="middle">bounded observation window</text>
  </g>

  <g>
    <rect x="855" y="390" width="300" height="120" rx="18" fill="#dfe8d8" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="875" y="420">04</text>
    <text class="step" x="1005" y="450" text-anchor="middle">Capture stable evidence</text>
    <text class="copy" x="1005" y="479" text-anchor="middle">bracketed Argo CD observations</text>
  </g>

  <g>
    <rect x="450" y="390" width="300" height="120" rx="18" fill="#ead8d4" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="470" y="420">05</text>
    <text class="step" x="600" y="450" text-anchor="middle">Evaluate and record</text>
    <text class="copy" x="600" y="479" text-anchor="middle">finding · decision · checksums</text>
  </g>

  <g>
    <rect x="45" y="390" width="300" height="120" rx="18" fill="#dfe8d8" stroke="#24251f" stroke-width="2"/>
    <text class="number" x="65" y="420">06</text>
    <text class="step" x="195" y="450" text-anchor="middle">Reset and verify baseline</text>
    <text class="copy" x="195" y="479" text-anchor="middle">continue only after verification</text>
  </g>

  <path class="line" d="M345 225 H450"/>
  <path class="line" d="M750 225 H855"/>
  <path class="line" d="M1005 285 V390"/>
  <path class="line" d="M855 450 H750"/>
  <path class="line" d="M450 450 H345"/>
  <path class="line dash" d="M195 390 V330 H120 V285"/>
  <text class="copy" x="212" y="350">next declared run</text>

  <path class="line" d="M195 510 V575"/>
  <rect x="45" y="575" width="300" height="86" rx="18" fill="#ead8d4" stroke="#5b2b24" stroke-width="2"/>
  <text class="step" x="195" y="609" text-anchor="middle" fill="#5b2b24">Stop collection</text>
  <text class="copy" x="195" y="638" text-anchor="middle" fill="#5b2b24">if reset verification fails</text>

  <text class="copy" x="450" y="620">One declared mutation per run. Formal records remain bound to the frozen protocol and source revision.</text>
</svg>
