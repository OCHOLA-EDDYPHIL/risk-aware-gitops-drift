name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.0"

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Race test
        run: make race

      - name: Build
        run: make build

      - name: Validate documentation links
        run: make docs-check

      - name: Validate release packaging
        run: make release-check

      - name: Set up kubectl for lab asset validation
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: "v1.35.6"

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate isolated lab assets
        run: make lab-static-check

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v1.17.1/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Test Rego policies
        run: |
          opa test --ignore argocd policies testdata
          make policy-integration-test
